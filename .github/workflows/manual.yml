name: Scrape M3U for German Channels

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter German channels
        run: |
          set -e

          M3U_URL="http://abc25.xyz/get.php?username=0231768061827&password=F439DE4966EC&type=m3u_plus&output=m3u8"

          {
            echo "#EXTM3U"
            echo "# Generated by GitHub Action at $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "# Source: $M3U_URL"
          } > GE.m3u

          curl -fsSL --max-time 120 -A "Mozilla/5.0" "$M3U_URL" | awk '
            /^#EXTINF/ {
              extinf = $0
              getline url
              while (url ~ /^#/ || url == "") { getline url }
              if (tolower(extinf) ~ /tvg-id="[^"]*\.?de"/ \
               || tolower(extinf) ~ /group-title="[^"]*(german|deutsch|germany|de)[^"]*"/ \
               || tolower(extinf) ~ /\bde\b/ \
               || tolower(extinf) ~ /\bger\b/ \
               || tolower(extinf) ~ /deutsch/ \
               || tolower(extinf) ~ /german/) {
                print extinf
                print url
                count++
              }
              next
            }
            END { printf("✅ Matched %d German channels\n", count) > "/dev/stderr" }
          ' >> GE.m3u

          echo "💾 Wrote GE.m3u ($(grep -c '^#EXTINF' GE.m3u) channels)"

      - name: Commit and push GE.m3u
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GE.m3u
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update GE.m3u ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

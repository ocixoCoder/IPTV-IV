name: Scrape M3U for English Channels

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter English channels
        run: |
          set -e

          M3U_URL="http://PUT-YOUR-URL-HERE/playlist.m3u"

          {
            echo "#EXTM3U"
            echo "# Generated by GitHub Action at $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "# Source: $M3U_URL"
          } > EN.m3u

          curl -fsSL --max-time 120 -A "Mozilla/5.0" "$M3U_URL" | awk '
            /^#EXTINF/ {
              extinf = $0
              getline url
              while (url ~ /^#/ || url == "") { getline url }

              # Only keep streams whose URL ends in .m3u8
              if (url !~ /\.m3u8(\?|$)/) { next }

              if (tolower(extinf) ~ /tvg-id="[^"]*\.?en"/ \
               || tolower(extinf) ~ /group-title="[^"]*(english|england|uk|united kingdom|usa|united states|us)[^"]*"/ \
               || tolower(extinf) ~ /\ben\b/ \
               || tolower(extinf) ~ /\beng\b/ \
               || tolower(extinf) ~ /english/) {
                print extinf
                print url
                count++
              }
              next
            }
            END { printf("✅ Matched %d English channels\n", count) > "/dev/stderr" }
          ' >> EN.m3u

          echo "💾 Wrote EN.m3u ($(grep -c '^#EXTINF' EN.m3u) channels)"

      - name: Commit and push EN.m3u
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add EN.m3u
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update EN.m3u ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
